<!doctype html>
<html lang="en-US">
  <head>
    <link rel="stylesheet" href="stylesheet.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>GameDev: Aarav (2026)</title>
  </head>
  <body>
    <h1>GameDev: Aarav (2026) - `t1a04-css-aarav`</h1>
    <div>
      <i>This is italicized</i>
      <br />
      <i id="i" style="color: rgb(0, 255, 0); background-color: blue"
        >This is italicized... but with different CSS
      </i>
      <br />
      <input
        type="button"
        value="Switch CSS (Try Clicking Me Multiple Times!)"
        onClick="{
          if (getComputedStyle(document.getElementById('i')).color === 'rgb(255, 0, 0)') {
              document.getElementById('i').style.color = 'rgb(0, 255, 0)';
              document.getElementById('i').style.backgroundColor = 'rgb(0, 0, 255)';
          } else {
              document.getElementById('i').style.color = 'rgb(255, 0, 0)';
              document.getElementById('i').style.backgroundColor = 'rgb(255, 255, 0)';
          }
      }"
      />
    </div>
    <br />
    <textarea
      style="
        background-image: url(&quot;assets/jpeg444.jpg&quot;);
        color: white;
        height: 256px;
        left: 0;
        position: relative;
        top: 0;
        width: 256px;
      "
    ></textarea>
    <img src="assets/test.jpg" style="border-radius: 128px" />
  </body>
</html>
