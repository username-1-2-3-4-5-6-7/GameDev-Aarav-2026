<!doctype html>
<html lang="en-US">
  <head>
    <link rel="stylesheet" href="stylesheet.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>GameDev: Aarav (2026)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.3/p5.min.js"></script>
  </head>
  <body>
    <h1>GameDev: Aarav (2026) - `t1a02-list-aarav`</h1>
    <table>
      <tr>
        <th><a href="https://happywhale.com">Happywhale</a></th>
      </tr>
      <tr>
        <th>
          <div>
            My Whale:
            <br />
            <img src="assets/myWhale.jpg" width="67" height="67" />
          </div>
        </th>
        <th></th>
      </tr>
    </table>
    <ul>
      <li>Blue</li>
      <li>Fin</li>
      <li>Humpback</li>
      <li>Bowhead</li>
      <li>Gray</li>
    </ul>
    <script>
      function preload() {
        whale = loadImage("assets/otherWhale.png");
      }

      function setup() {
        createCanvas(512, 256);
      }

      // Thanks again, OpenAI.
      function draw() {
        // Blue
        background(100, 180, 220);

        x = x + speed;

        if (x > width - 100 || x < 0) {
          speed = speed * -1;
        }

        let y = 70 + sin(frameCount * 0.05) * 10;

        image(whale, x, y, 100, 100);
      }
    </script>
  </body>
</html>
