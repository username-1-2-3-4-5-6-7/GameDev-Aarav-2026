<!doctype html>
<html lang="en-US">
  <head>
    <link rel="stylesheet" href="stylesheet.css" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>GameDev: Aarav (2026)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.3.3/p5.min.js"></script>
  </head>
  <body>
    <h1>GameDev: Aarav (2026) - `t1a01-table-aarav`</h1>
    <table>
      <tr>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
      </tr>
    </table>
    <br />
    <table>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
    </table>
    <br />
    <table>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
    </table>
    <br />
    <table>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
      <tr>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
        <th><div class="p5-cell"></div></th>
      </tr>
    </table>
    <script>
      const cells = document.querySelectorAll(".p5-cell");

      cells.forEach((cell, index) => {
        // Thanks, OpenAI
        new p5((p) => {
          let video;

          p.setup = () => {
            const canvas = p.createCanvas(160, 90);
            canvas.parent(cell);

            const video = p.createVideo(["assets/beach.mp4"]);

            video.size(160, 90);
            video.loop();
            video.parent(cell);

            video.hide();
          };

          p.draw = () => {
            if (
              video &&
              video.elt.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA
            ) {
              p.image(video, 0, 0, 160, 90);
            }
          };
        });
      });
    </script>
  </body>
</html>
