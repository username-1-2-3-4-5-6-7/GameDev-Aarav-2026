    </table>
    <script>
      const cells = document.querySelectorAll(".p5-cell");

      cells.forEach((cell, index) => {
        // Thanks, OpenAI
        new p5((p) => {
          let video;

          p.setup = () => {
            const canvas = p.createCanvas(160, 90);
            canvas.parent(cell);

            video = p.createVideo(["assets/beach.mp4"]);

            video.size(160, 90);
            video.loop();
            video.parent(cell);

            video.hide();
          };

          p.draw = () => {
            if (
              video &&
              video.elt.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA
            ) {
              p.image(video, 0, 0, 160, 90);
            }
          };
        });
      });
    </script>
